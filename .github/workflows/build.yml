# TEMPLATE mac-swift.yml from MANTRA_MANIFEST/workflows (source: G815_LIGHTS build.yml). Change APP (the .app name in
# build/) and VERSION_FILE. build.sh must sign with "${SIGN:-Mantra Apps}"; here SIGN=- (ad hoc). On the Mac the
# release zip is downloaded, unzipped into /Applications and re-signed "Mantra Apps" (workflows/README.md, Install).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  APP: "Ableton Live Assistant (Mantra)"
  VERSION_FILE: app/Common.swift
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test the Space decision (no Live needed)
        run: |
          mkdir -p "$RUNNER_TEMP/tt" && cp app/Transport.swift "$RUNNER_TEMP/tt/Transport.swift" && cp tests/transport_test.swift "$RUNNER_TEMP/tt/main.swift"
          swiftc -o "$RUNNER_TEMP/transport_test" "$RUNNER_TEMP/tt/Transport.swift" "$RUNNER_TEMP/tt/main.swift" && "$RUNNER_TEMP/transport_test"
      - name: Shared MIDI modules - same sources as the other app (hash) and their tests
        run: |
          H=$(ls shared/*.swift | sort | xargs cat | shasum -a 256 | cut -d' ' -f1)
          echo "shared sources: $H"
          [ "$H" = "$(cat shared.sha256)" ] || { echo "FAIL: shared/ differs from shared.sha256"; exit 1; }
          mkdir -p "$RUNNER_TEMP/st" && cp shared/SharedPure.swift "$RUNNER_TEMP/st/" && cp shared/tests/shared_test.swift "$RUNNER_TEMP/st/main.swift"
          swiftc -o "$RUNNER_TEMP/shared_test" "$RUNNER_TEMP/st/SharedPure.swift" "$RUNNER_TEMP/st/main.swift" && "$RUNNER_TEMP/shared_test"
      - name: Command mode or typing (the decision, and the mutations that must fail)
        run: |
          mkdir -p "$RUNNER_TEMP/km" && cp app/KeyMode.swift "$RUNNER_TEMP/km/KeyMode.swift" && cp tests/keymode_test.swift "$RUNNER_TEMP/km/main.swift"
          swiftc -o "$RUNNER_TEMP/km_test" "$RUNNER_TEMP/km/KeyMode.swift" "$RUNNER_TEMP/km/main.swift" && "$RUNNER_TEMP/km_test"
          for M in 's/if focus.live == false {/if false {/' 's/KeyMode.textRoles.contains(r) {/KeyMode.textRoles.contains(r), false {/' 's/if focus.dialog {/if false {/' 's/if typingFlag {/if false {/' 's/if launcherBox {/if false {/'; do
            mkdir -p "$RUNNER_TEMP/kmm" && sed "$M" app/KeyMode.swift > "$RUNNER_TEMP/kmm/KeyMode.swift"
            cmp -s app/KeyMode.swift "$RUNNER_TEMP/kmm/KeyMode.swift" && { echo "the mutation $M did not apply"; exit 1; }
            cp tests/keymode_test.swift "$RUNNER_TEMP/kmm/main.swift"
            swiftc -o "$RUNNER_TEMP/kmm_test" "$RUNNER_TEMP/kmm/KeyMode.swift" "$RUNNER_TEMP/kmm/main.swift"
            if "$RUNNER_TEMP/kmm_test" >/dev/null; then echo "BAD: the tests did not catch: $M"; exit 1; else echo "GOOD: the tests failed when the check was removed: $M"; fi
          done
      - name: I and O (the loop marks) and the Custom Shortcuts model
        run: |
          mkdir -p "$RUNNER_TEMP/lm" && cp app/LoopMarks.swift "$RUNNER_TEMP/lm/" && cp tests/loopmarks_test.swift "$RUNNER_TEMP/lm/main.swift"
          swiftc -o "$RUNNER_TEMP/lm_test" "$RUNNER_TEMP/lm/LoopMarks.swift" "$RUNNER_TEMP/lm/main.swift" && "$RUNNER_TEMP/lm_test"
          mkdir -p "$RUNNER_TEMP/sc" && cp app/Shortcuts.swift app/KeyMode.swift "$RUNNER_TEMP/sc/" && cp tests/shortcuts_test.swift "$RUNNER_TEMP/sc/main.swift"
          swiftc -o "$RUNNER_TEMP/sc_test" "$RUNNER_TEMP/sc/Shortcuts.swift" "$RUNNER_TEMP/sc/KeyMode.swift" "$RUNNER_TEMP/sc/main.swift" && "$RUNNER_TEMP/sc_test"
          # mutations that must fail: the new mark no longer wins; capture no longer frees the old key
          mkdir -p "$RUNNER_TEMP/lmm" && sed 's/if let b = currentOut, b > p + 0.001 { end = b } else { end = p + len }/end = p + len/' app/LoopMarks.swift > "$RUNNER_TEMP/lmm/LoopMarks.swift"
          cmp -s app/LoopMarks.swift "$RUNNER_TEMP/lmm/LoopMarks.swift" && { echo "mutation did not apply"; exit 1; }
          cp tests/loopmarks_test.swift "$RUNNER_TEMP/lmm/main.swift"
          swiftc -o "$RUNNER_TEMP/lmm_test" "$RUNNER_TEMP/lmm/LoopMarks.swift" "$RUNNER_TEMP/lmm/main.swift"
          if "$RUNNER_TEMP/lmm_test" >/dev/null; then echo "BAD: the loop tests did not catch I forgetting the OUT"; exit 1; else echo "GOOD: the loop tests failed when I forgets the OUT"; fi
          mkdir -p "$RUNNER_TEMP/scm" && cp app/KeyMode.swift "$RUNNER_TEMP/scm/" && sed 's/code: code, mods: mods) == true }/code: code, mods: mods) == true \&\& 1 == 2 }/' app/Shortcuts.swift > "$RUNNER_TEMP/scm/Shortcuts.swift"
          cmp -s app/Shortcuts.swift "$RUNNER_TEMP/scm/Shortcuts.swift" && { echo "mutation did not apply"; exit 1; }
          cp tests/shortcuts_test.swift "$RUNNER_TEMP/scm/main.swift"
          swiftc -o "$RUNNER_TEMP/scm_test" "$RUNNER_TEMP/scm/Shortcuts.swift" "$RUNNER_TEMP/scm/KeyMode.swift" "$RUNNER_TEMP/scm/main.swift"
          if "$RUNNER_TEMP/scm_test" >/dev/null; then echo "BAD: the shortcut tests did not catch a key that is never found"; exit 1; else echo "GOOD: the shortcut tests failed when keys are never found"; fi
      - name: Pins (name, bundle id, settings files, one title, no app OFF)
        run: bash tests/pins.sh
      - name: The pins hold (mutation) - stopped goes back to Continue Playback, the test MUST fail
        run: |
          mkdir -p "$RUNNER_TEMP/mt" && sed 's/return intoLoop ? .playIntoLoop : .playFromInsertPoint/return .continuePlayback/' app/Transport.swift > "$RUNNER_TEMP/mt/Transport.swift"
          cmp -s app/Transport.swift "$RUNNER_TEMP/mt/Transport.swift" && { echo "the mutation did not apply"; exit 1; }
          cp tests/transport_test.swift "$RUNNER_TEMP/mt/main.swift"
          swiftc -o "$RUNNER_TEMP/mt_test" "$RUNNER_TEMP/mt/Transport.swift" "$RUNNER_TEMP/mt/main.swift"
          if "$RUNNER_TEMP/mt_test"; then echo "BAD: the test did not catch the old bug"; exit 1; else echo "GOOD: the test failed on the old behaviour"; fi
      - name: The pins hold (mutation 2) - the stop ignores his click again, the test MUST fail
        run: |
          mkdir -p "$RUNNER_TEMP/mt2" && sed 's/return follow && userMovedWhilePlaying == false ? .stopAndPlant : .stop/return follow ? .stopAndPlant : .stop/' app/Transport.swift > "$RUNNER_TEMP/mt2/Transport.swift"
          cmp -s app/Transport.swift "$RUNNER_TEMP/mt2/Transport.swift" && { echo "the mutation did not apply"; exit 1; }
          cp tests/transport_test.swift "$RUNNER_TEMP/mt2/main.swift"
          swiftc -o "$RUNNER_TEMP/mt2_test" "$RUNNER_TEMP/mt2/Transport.swift" "$RUNNER_TEMP/mt2/main.swift"
          if "$RUNNER_TEMP/mt2_test"; then echo "BAD: the test did not catch the ignored click"; exit 1; else echo "GOOD: the test failed when the click is ignored"; fi
      - name: Build
        run: SIGN=- NO_INSTALL=1 ./build.sh
      - name: Pack
        run: cd build && ditto -c -k --keepParent "$APP.app" app.zip
      - name: Release (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^let VERSION = \([0-9]*\)/\1/p' "$VERSION_FILE")
          if gh release view "v$V" >/dev/null 2>&1; then gh release upload "v$V" build/app.zip --clobber
          else gh release create "v$V" build/app.zip --target "$GITHUB_SHA" --latest --title "$APP v$V" --notes "$(git log -1 --format=%s)"; fi
